<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- アプリアイコン（ミシェーラ appicon-kuma-v1、2026-11-14 オーナー採用。元は art/branding/、縮小だけ） -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-title" content="もぐもGO" />
    <!-- ホーム画面から開いたときにアドレスバーを出さない（アプリとして開く）。2026-11-18 オーナー -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 開く瞬間の白い画面の代わりに、タイトルと同じ絵を出す（機種ごとの大きさ。作り方 art/prototypes/startup-images.sh） -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1320x2868.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1290x2796.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1206x2622.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1179x2556.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1284x2778.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1170x2532.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1242x2688.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1125x2436.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/startup/startup-828x1792.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/startup/startup-1242x2208.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/startup/startup-750x1334.jpg" />
    <meta name="theme-color" content="#ffffff" />
    <title>もぐもGO</title>
    <!-- 起動してすぐ（アプリの読み込み前）からタイトルの絵とロゴを出す。何も無い画面をダブルタップして拡大されるのを防ぐ（2026-11-17）。
         アプリのタイトル（src/credits/Splash.tsx）が出たら消す。絵は src/assets/ui/ の写し（public/boot/） -->
    <style>
      html, body { margin: 0; background: #ffffff; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      #boot { position: fixed; inset: 0; z-index: 200; background: #ffffff url(/boot/title.webp) center bottom / cover no-repeat; }
      #boot img { position: absolute; left: 50%; top: calc(15vh + env(safe-area-inset-top)); width: min(84vw, 420px); transform: translateX(-50%); filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18)); }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/boot/logo.webp" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
